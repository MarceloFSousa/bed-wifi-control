<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle da Cama</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="panel">
        <h1>Controle da Cama</h1>

        <div class="field">
            <label for="seconds">Segundos</label>
            <input type="number" id="seconds" min="0.1" step="0.1" value="1">
        </div>

        <section class="group">
            <h2>Encosto</h2>
            <div class="row">
                <button class="btn" data-part="backrest" data-direction="up">Subir</button>
                <button class="btn" data-part="backrest" data-direction="down">Descer</button>
            </div>
        </section>

        <section class="group">
            <h2>Pernas</h2>
            <div class="row">
                <button class="btn" data-part="legs" data-direction="up">Subir</button>
                <button class="btn" data-part="legs" data-direction="down">Descer</button>
            </div>
        </section>

        <button class="btn stop" id="stop-btn">Parar</button>

        <section class="group">
            <h2>Memoria</h2>
            <div class="row">
                <button class="btn small" data-memory-save="1">Salvar 1</button>
                <button class="btn small" data-memory-save="2">Salvar 2</button>
                <button class="btn small" data-memory-save="3">Salvar 3</button>
            </div>
            <div class="row">
                <button class="btn small" data-memory-recall="1">Ir p/ 1</button>
                <button class="btn small" data-memory-recall="2">Ir p/ 2</button>
                <button class="btn small" data-memory-recall="3">Ir p/ 3</button>
            </div>
        </section>

        <p class="status" id="status">Pronto.</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
